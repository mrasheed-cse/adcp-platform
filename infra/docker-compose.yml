# Local development stack. Run from the repo root:  make up
# Requires a .env file in the repo root with TOKEN_SECRET (copy .env.example).
name: adcp-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: adtech
      POSTGRES_USER: adtech
      POSTGRES_PASSWORD: adtech
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adtech"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: adtech
      CLICKHOUSE_PASSWORD: adtech
      CLICKHOUSE_DB: adtech
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    depends_on: [kafka]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  trafficking-api:
    build:
      context: ..
      dockerfile: infra/java.Dockerfile
      args: { SERVICE: trafficking-api }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/adtech
      DB_USER: adtech
      DB_PASSWORD: adtech
      REDIS_HOST: redis
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  adcp-sales-agent:
    build:
      context: ..
      dockerfile: infra/java.Dockerfile
      args: { SERVICE: adcp-sales-agent }
    environment:
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/adtech?currentSchema=sales_agent
      DB_USER: adtech
      DB_PASSWORD: adtech
      TRAFFICKING_URL: http://trafficking-api:8083
      ADCP_DEMO_TOKEN: ${ADCP_DEMO_TOKEN:-}
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      trafficking-api: { condition: service_started }

  adserver-decision:
    build:
      context: ..
      dockerfile: infra/go.Dockerfile
      args: { SERVICE: adserver-decision }
    environment:
      REDIS_ADDR: redis:6379
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      COLLECTOR_BASE_URL: http://localhost:8082
    ports: ["8081:8081"]
    depends_on:
      redis: { condition: service_healthy }

  event-collector:
    build:
      context: ..
      dockerfile: infra/go.Dockerfile
      args: { SERVICE: event-collector }
    environment:
      REDIS_ADDR: redis:6379
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
      KAFKA_BROKERS: kafka:9092
    ports: ["8082:8082"]
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_started }

volumes:
  pgdata:
  chdata:
