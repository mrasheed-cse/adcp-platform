server:
  port: ${PORT:8083}

spring:
  application:
    name: trafficking-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adtech}
    username: ${DB_USER:adtech}
    password: ${DB_PASSWORD:adtech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

trafficking:
  snapshot:
    # Full republish even without changes, so ended line items drop out and a wiped Redis recovers.
    republish-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info
